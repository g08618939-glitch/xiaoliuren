<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><title>九神小六壬九宫</title><style>body{margin:0;background:#f6f1e8;font-family:-apple-system,sans-serif;color:#29231e}.app{max-width:760px;margin:auto;padding:18px 15px 80px}.card{background:white;border-radius:16px;padding:15px;margin:12px 0}h1{font-size:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{font-size:13px;color:#71675e}input,select,button{width:100%;box-sizing:border-box;padding:11px;margin-top:5px;border:1px solid #ddd1c2;border-radius:9px;background:#fff;font-size:16px}button{background:#783f2b;color:#fff;border:0;font-weight:bold}.secondary{background:#f2e7dc;color:#783f2b}.muted{color:#766f68;font-size:13px}.notice{background:#fff4d9;border-left:4px solid #c99638;padding:9px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.cell{background:#f8f1e8;border:1px solid #e6d7c7;border-radius:10px;text-align:center;padding:10px;min-height:65px}.cell b{display:block;color:#783f2b;margin:6px}.tag{background:#783f2b;color:#fff;border-radius:4px;font-size:11px;padding:2px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.step{text-align:center;background:#f8f1e8;padding:9px;border-radius:9px}.step b{color:#783f2b;font-size:17px}.hidden{display:none}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;gap:9px;padding:9px}.tabs button{width:auto;background:none;color:#783f2b}@media(max-width:460px){.grid{grid-template-columns:1fr}}</style><main class="app"><h1>九神小六壬九宫</h1><p class="muted">公历、农历、时间和时辰自动联动</p><section id="castPage"><div class="card"><h2>选择起课方式</h2><select id="mode"><option value="lunar">农历时间起课</option><option value="numbers">三数起课</option></select><div id="lunarForm"><div class="grid"><label>公历日期<input id="solarDate" type="date"></label><label>公历时间<input id="solarTime" type="time"></label><label>农历年份<input id="lyear" type="number"></label><label>农历月份<input id="lmonth" type="number" min="1" max="12"></label><label>农历日期<input id="lday" type="number" min="1" max="30"></label><label>时辰<select id="hour"></select></label><label>闰月<select id="leap"><option value="0">否</option><option value="1">是</option></select></label></div><p class="muted">修改公历会更新农历；修改农历会反查公历。闰月与子时边界待历法资料核验。</p></div><div id="numbersForm" class="hidden"><div class="grid"><label>数字一<input id="n1" type="number" min="0" value="1"></label><label>数字二<input id="n2" type="number" min="0" value="2"></label><label>数字三<input id="n3" type="number" min="0" value="3"></label></div></div><label>事项类型<select id="matter"></select></label><label>问题备注<input id="note"></label><button id="cast">立即起课</button></div><div id="result"></div></section><section id="historyPage" class="hidden"><h1>历史记录</h1><div id="history"></div></section><section id="knowledgePage" class="hidden"><h1>规则</h1><div class="card notice">九神循环、九宫、三传和五行属性是可配置的项目规则；部分传统来源尚未核验。</div><div id="knowledge"></div></section></main><nav class="tabs"><button data-p="castPage">起课</button><button data-p="historyPage">历史</button><button data-p="knowledgePage">规则</button></nav><script type="module">
import{RULE_CONFIG,NAMES,GODS,MATTER,lunarTime,threeNumbers,board,analyze,nameAt}from'./engine.js';const $=x=>document.getElementById(x),hours=['子时','丑时','寅时','卯时','辰时','巳时','午时','未时','申时','酉时','戌时','亥时'];hours.forEach((x,i)=>$('hour').add(new Option(x,i)));Object.keys(MATTER).forEach(x=>$('matter').add(new Option(x,x)));let syncing=false;function solarToLunar(){const d=new Date(`${$('solarDate').value}T${$('solarTime').value||'00:00'}:00`),p=new Intl.DateTimeFormat('en-u-ca-chinese',{month:'numeric',day:'numeric'}).formatToParts(d),m=Number(p.find(x=>x.type==='month')?.value)||1,day=Number(p.find(x=>x.type==='day')?.value)||1;$('lyear').value=d.getFullYear();$('lmonth').value=m;$('lday').value=day;$('hour').value=d.getHours()===23?0:Math.floor((d.getHours()+1)/2)%12}function lunarToSolar(){const y=+$('lyear').value,m=+$('lmonth').value,day=+$('lday').value;for(let i=-370;i<=370;i++){const d=new Date(y,0,1);d.setDate(d.getDate()+i);const p=new Intl.DateTimeFormat('en-u-ca-chinese',{month:'numeric',day:'numeric'}).formatToParts(d),mm=Number(p.find(x=>x.type==='month')?.value),dd=Number(p.find(x=>x.type==='day')?.value);if(mm===m&&dd===day){$('solarDate').value=d.toISOString().slice(0,10);return}}}function hourToTime(){const h=+$('hour').value;$('solarTime').value=`${String(h?2*h-1:0).padStart(2,'0')}:00`}const now=new Date();$('solarDate').value=now.toISOString().slice(0,10);$('solarTime').value=now.toTimeString().slice(0,5);solarToLunar();['solarDate','solarTime'].forEach(id=>$(id).onchange=()=>{if(!syncing){syncing=true;solarToLunar();syncing=false}});['lyear','lmonth','lday','leap'].forEach(id=>$(id).onchange=()=>{if(!syncing){syncing=true;lunarToSolar();syncing=false}});$('hour').onchange=()=>{if(!syncing){syncing=true;hourToTime();syncing=false}};$('mode').onchange=()=>{const n=$('mode').value==='numbers';$('numbersForm').classList.toggle('hidden',!n);$('lunarForm').classList.toggle('hidden',n)};
function render(r){const a=analyze(r.transmissions,$('matter').value),b=board(r.transmissions);$('result').innerHTML=`<div class="card"><h2>一、起课信息</h2><p>${r.mode}：${r.mode==='三数起课'?r.numbers.join('、'):`公历${$('solarDate').value} ${$('solarTime').value} · 农历${r.input.month}月${r.input.day}日 · ${hours[r.input.hour]}`}</p><p class="muted">${r.rule}</p></div><div class="card"><h2>二、九宫排盘</h2><div class="board">${b.flat().map(x=>`<div class="cell">${x.palace}宫<b>${x.god}</b>${x.mark.map(m=>`<span class="tag">${m}</span>`).join('')}</div>`).join('')}</div></div><div class="card"><h2>三传解读</h2><div class="steps">${a.gods.map((g,i)=>`<div class="step">${['初传','中传','末传'][i]}<br><b>${g}</b><br>${GODS[r.transmissions[i]-1].meaning}</div>`).join('')}</div><p>${a.summary}</p><p class="notice">传统术数未经过科学验证；健康事项不能替代医疗建议。</p><button id="save">保存到历史</button><button class="secondary" id="copy">复制结果</button></div>`;const item={...r,matter:$('matter').value,time:new Date().toLocaleString(),version:RULE_CONFIG.version};$('save').onclick=()=>{const l=JSON.parse(localStorage.jslr||'[]');l.unshift(item);localStorage.jslr=JSON.stringify(l.slice(0,50));loadHistory();alert('已保存')};$('copy').onclick=()=>navigator.clipboard?.writeText(a.summary)}$('cast').onclick=()=>{try{render($('mode').value==='numbers'?threeNumbers(+$('n1').value,+$('n2').value,+$('n3').value):lunarTime(+$('lmonth').value,+$('lday').value,+$('hour').value))}catch(e){alert(e.message)}};function loadHistory(){const l=JSON.parse(localStorage.jslr||'[]');$('history').innerHTML=l.length?l.map((x,i)=>`<div class="card"><b>${x.mode} · ${x.matter}</b><p>${x.time} · ${x.transmissions.map(nameAt).join(' → ')}</p><button class="secondary" onclick="localStorage.jslr=JSON.stringify(JSON.parse(localStorage.jslr).filter((_,j)=>j!==${i}));location.reload()">删除</button></div>`).join(''):'<div class="card muted">暂无记录</div>'}loadHistory();$('knowledge').innerHTML=NAMES.map((n,i)=>`<div class="card"><b>${n}</b><p>${GODS[i].meaning}</p><p class="muted">五行：待验证</p></div>`).join('');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));$(b.dataset.p).classList.remove('hidden');if(b.dataset.p==='historyPage')loadHistory()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></html>
