<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><title>九神小六壬九宫</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#29231e;background:#f6f1e8}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;padding:20px 16px 90px}h1{font-size:25px;margin:8px 0 4px}h2{font-size:18px;margin:0 0 12px}.muted{color:#766f68;font-size:13px}.card{background:#fff;border-radius:18px;padding:16px;margin:13px 0;box-shadow:0 3px 15px #59401c14}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;color:#71675e}input,select,button{width:100%;padding:11px;border:1px solid #ddd1c2;border-radius:10px;background:#fff;font-size:16px;margin-top:5px}button{background:#783f2b;color:#fff;border:0;font-weight:700}.secondary{background:#f4e9df;color:#783f2b}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eadfd3;display:flex;gap:8px;justify-content:center;padding:9px 10px calc(9px + env(safe-area-inset-bottom));z-index:2}.tabs button{width:auto;background:none;color:#783f2b;padding:8px 16px}.hidden{display:none}.notice{background:#fff4d9;border-left:4px solid #c99638;padding:10px;border-radius:8px;font-size:13px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.cell{min-height:92px;background:#f8f1e8;border-radius:12px;padding:9px;text-align:center;border:1px solid #e6d7c7}.cell small{display:block;color:#82766a}.cell b{display:block;color:#783f2b;font-size:17px;margin:7px 0}.tag{display:inline-block;background:#783f2b;color:#fff;border-radius:5px;padding:2px 5px;font-size:11px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.step{text-align:center;background:#f8f1e8;padding:10px;border-radius:10px}.step b{font-size:18px;color:#783f2b}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}@media(max-width:480px){.grid{grid-template-columns:1fr}.app{padding-top:14px}.cell{min-height:84px;padding:6px}.cell b{font-size:15px}}</style></head><body><main class="app"><header><h1>九神小六壬九宫</h1><p class="muted">起课、九宫排盘、三传与事项分析</p></header><section id="castPage"><div class="card"><h2>选择起课方式</h2><select id="mode"><option value="lunar">农历时间起课</option><option value="numbers">三数起课</option></select><div id="lunarForm"><div class="grid"><label>农历年份<input id="lyear" type="number" value="2026"></label><label>农历月份<input id="lmonth" type="number" min="1" max="12" value="1"></label><label>农历日期<input id="lday" type="number" min="1" max="30" value="1"></label><label>时辰<select id="hour"></select></label><label>是否闰月<select id="leap"><option>否</option><option>是</option></select></label></div></div><div id="numbersForm" class="hidden"><div class="grid"><label>数字一<input id="n1" type="number" min="0" value="1"></label><label>数字二<input id="n2" type="number" min="0" value="2"></label><label>数字三<input id="n3" type="number" min="0" value="3"></label></div></div><label>事项类型<select id="matter"></select></label><label>问题备注<input id="note" maxlength="100" placeholder="可选"></label><button id="cast">立即起课</button></div><div id="result" class="hidden"></div></section><section id="historyPage" class="hidden"><h1>历史记录</h1><div id="history"></div></section><section id="knowledgePage" class="hidden"><h1>规则与九神</h1><div class="card"><p class="notice">重要说明：九神循环、示意九宫、三传算法和五行属性目前是可配置项目规则，部分传统来源尚未核验，不代表统一的传统标准。</p><p class="muted">算法版本：JSLR-MVP-0.1 · 本地运行，数据不上传。</p></div><div id="knowledge"></div></section></main><nav class="tabs"><button data-page="castPage">起课</button><button data-page="historyPage">历史</button><button data-page="knowledgePage">规则</button></nav><script type="module">
import {RULE_CONFIG,NAMES,GODS,MATTER,lunarTime,threeNumbers,board,analyze,nameAt} from './engine.js';const $=id=>document.getElementById(id),hours=['子时','丑时','寅时','卯时','辰时','巳时','午时','未时','申时','酉时','戌时','亥时'];hours.forEach((x,i)=>$('hour').add(new Option(x,i)));Object.keys(MATTER).forEach(x=>$('matter').add(new Option(x,x)));$('mode').onchange=()=>{const n=$('mode').value==='numbers';$('numbersForm').classList.toggle('hidden',!n);$('lunarForm').classList.toggle('hidden',n)};
function render(r){const a=analyze(r.transmissions,$('matter').value),b=board(r.transmissions);$('result').classList.remove('hidden');$('result').innerHTML=`<div class="card"><h2>一、起课信息</h2><p>方式：${r.mode} · 输入：${r.mode==='三数起课'?r.numbers.join('、'):`农历${r.input.month}月${r.input.day}日 · ${hours[r.input.hour]}`}</p><p class="muted">规则：${r.rule}</p></div><div class="card"><h2>二、九宫排盘</h2><p class="muted">九宫布局为示意配置，尚未核验。</p><div class="board">${b.flat().map(x=>`<div class="cell"><small>${x.palace}宫</small><b>${x.god}</b>${x.mark.map(m=>`<span class="tag">${m}</span>`).join('')}</div>`).join('')}</div></div><div class="card"><h2>三至五、三传解读</h2><div class="steps">${a.gods.map((g,i)=>`<div class="step">${['初传','中传','末传'][i]}<br><b>${g}</b><br><small>${GODS[r.transmissions[i]-1].meaning}</small></div>`).join('')}</div><p>${a.summary}</p></div><div class="card"><h2>六、五行分析</h2><p>九神五行：未配置/待验证。</p>${a.relations.map((x,i)=>`<p>${a.gods[i]} → ${a.gods[i+1]}：<b>${x.type}</b>（${x.basis}）</p>`).join('')}</div><div class="card"><h2>七至九、综合判断</h2><p>${a.summary}</p><p class="notice">风险提示：传统术数不具有经过科学验证的预测能力；健康事项不能替代医生诊断，重要决定请依据事实和专业意见。</p><button id="save">保存到历史记录</button><button class="secondary" id="copy">复制结果</button></div>`;const item={...r,matter:$('matter').value,note:$('note').value,time:new Date().toLocaleString('zh-CN'),version:RULE_CONFIG.version};$('save').onclick=()=>{const list=JSON.parse(localStorage.jslr||'[]');list.unshift(item);localStorage.jslr=JSON.stringify(list.slice(0,50));loadHistory();alert('已保存到本机')};$('copy').onclick=()=>navigator.clipboard?.writeText(a.summary).then(()=>alert('已复制'))}
$('cast').onclick=()=>{try{const r=$('mode').value==='numbers'?threeNumbers(+$('n1').value,+$('n2').value,+$('n3').value):lunarTime(+$('lmonth').value,+$('lday').value,+$('hour').value);render(r)}catch(e){alert(e.message)}};function loadHistory(){const l=JSON.parse(localStorage.jslr||'[]');$('history').innerHTML=l.length?l.map((x,i)=>`<div class="card"><div class="row"><b>${x.mode} · ${x.matter}</b><button class="secondary" data-del="${i}">删除</button></div><p>${x.time} · ${x.transmissions.map(nameAt).join(' → ')}</p><p class="muted">版本：${x.version}</p></div>`).join(''):'<div class="card muted">暂无记录</div>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{l.splice(+b.dataset.del,1);localStorage.jslr=JSON.stringify(l);loadHistory()})}loadHistory();$('knowledge').innerHTML=NAMES.map((n,i)=>`<div class="card"><h2>${n}</h2><p>${GODS[i].meaning}</p><p class="muted">五行：${GODS[i].element} · 来源：${GODS[i].source} · ${GODS[i].status}</p></div>`).join('');document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('main>section').forEach(s=>s.classList.add('hidden'));$(b.dataset.page).classList.remove('hidden');if(b.dataset.page==='historyPage')loadHistory()});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
